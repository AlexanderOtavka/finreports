name: Remove PR demo

# A closed pull request's demo revision loses its tag, and with it its URL. The revision
# itself stays, serving nothing and costing nothing, until Cloud Run prunes old revisions.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  untag:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      # The default branch: a closed PR's merge ref may be gone.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: preview-deployer@finreports-firefly.iam.gserviceaccount.com

      # nix/demo.nix
      - name: Remove the tag
        env:
          PR: ${{ github.event.pull_request.number }}
        run: nix run .#demo -- untag "$PR"
