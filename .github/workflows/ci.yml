name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The weekly update dispatches this on its branch (a PR opened with GITHUB_TOKEN gets no
  # pull_request run), and on main after merging it (nor does that push get a push run).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/alexanderotavka/finreports
  # Artifact Registry's pull-through cache of the same package (infra/demo.nix).
  DEMO_IMAGE_NAME: us-central1-docker.pkg.dev/finreports-firefly/ghcr/alexanderotavka/finreports

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      # Builds the package and the image, typechecks, runs the unit tests against a
      # throwaway PostgreSQL, and drives the UI with headless Chromium.
      - name: nix flake check
        run: nix flake check -L

      - name: Collect smoke-test screenshots
        if: always()
        run: nix build .#checks.x86_64-linux.smoke --out-link smoke-output || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-output/
          if-no-files-found: ignore

  container:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      demo-digest: ${{ steps.demo.outputs.digest }}
    env:
      # Main, and pull requests from this repository: forks and Dependabot get a read-only
      # token, so no image and no demo.
      PUBLISH_DEMO: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build and load the images
        run: |
          nix build .#container --out-link container.tar.gz
          docker load < container.tar.gz
          nix build .#demo-container --out-link demo-container.tar.gz
          docker load < demo-container.tar.gz

      - name: Check the image runs as uid 1000 with a read-only root
        env:
          IMAGE: finreports:latest
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "1000:1000"
          # Without login settings the service refuses to start, and says why.
          out="$(docker run --rm --read-only --tmpfs /tmp -e BACKEND=sample "$IMAGE" 2>&1 || true)"
          grep -q "OAUTH_CLIENT_ID" <<<"$out"
          # With them, it migrates, syncs the sample data, and answers its health check.
          docker run -d --name app --network host --read-only --tmpfs /tmp \
            -e BACKEND=sample -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
            -e PUBLIC_ORIGIN=https://firefly.example.com \
            -e OAUTH_CLIENT_ID=1 -e OAUTH_CLIENT_SECRET=x -e ALLOWED_EMAILS=owner@example.com "$IMAGE"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/reports/-/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8080/reports/-/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: firefly.example.com' http://localhost:8080/reports/api/session)" = 401
          docker logs app
          docker rm -f app

      - name: Check the demo image runs alone and lets anyone in
        env:
          IMAGE: finreports-demo:latest
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "1000:1000"
          docker run -d --name demo -p 8081:8080 --read-only --tmpfs /tmp "$IMAGE"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8081/reports/-/healthz && break
            sleep 1
          done
          curl -sf -H 'Host: pr-1---finreports-demo-x.a.run.app' http://localhost:8081/reports/api/session |
            jq -e '.email == "demo@example.com" and .demo == true'
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8081/reports/api/status | jq -e '.txns > 1000' && break
            sleep 1
          done
          curl -sf http://localhost:8081/reports/api/status | jq -e '.txns > 1000'
          docker logs demo
          docker rm -f demo

      - name: Log in to GHCR
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || env.PUBLISH_DEMO == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish sha-<commit> and latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for tag in "sha-${GITHUB_SHA}" latest; do
            docker tag finreports:latest "${IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
          done
          echo "Published \`${IMAGE_NAME}@$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:sha-${GITHUB_SHA}" | cut -d@ -f2)\`" >> "$GITHUB_STEP_SUMMARY"

      # Into the same public package, as demo-* tags, which Cloud Run pulls through Artifact
      # Registry: a new package would start out private.
      - name: Publish the demo image as demo-sha-<commit> (and demo, on main)
        id: demo
        if: env.PUBLISH_DEMO == 'true'
        run: |
          set -euo pipefail
          tags=("demo-sha-${GITHUB_SHA}")
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(demo); fi
          for tag in "${tags[@]}"; do
            docker tag finreports-demo:latest "${IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
          done
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:demo-sha-${GITHUB_SHA}" | cut -d@ -f2)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published \`${IMAGE_NAME}@${digest}\` (demo)" >> "$GITHUB_STEP_SUMMARY"
    permissions:
      contents: read
      packages: write

  # Main's demo takes the service's traffic; a pull request's is a tagged revision with no
  # traffic, at its own URL, shown on the PR as a deployment. preview-cleanup.yml removes the
  # tag when the PR closes. Skipped until infra/ is bootstrapped (infra/README.md).
  demo:
    needs: container
    if: needs.container.outputs.demo-digest != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'demo-pr' || 'demo' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: preview-deployer@finreports-firefly.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy
        id: deploy
        env:
          IMAGE: ${{ env.DEMO_IMAGE_NAME }}@${{ needs.container.outputs.demo-digest }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          service=(finreports-demo --region us-central1 --quiet)
          # Two deploys at once (two PRs) can conflict on the service; the loser retries.
          retry() { for i in 1 2 3 4; do "$@" && return; sleep $((i * 15)); done; "$@"; }
          if [ -n "$PR" ]; then
            retry gcloud run deploy "${service[@]}" --image "$IMAGE" --tag "pr-${PR}" --no-traffic
            url="$(gcloud run services describe "${service[@]}" --format=json |
              jq -r --arg tag "pr-${PR}" '.status.traffic[] | select(.tag == $tag) | .url')"
          else
            retry gcloud run deploy "${service[@]}" --image "$IMAGE"
            # A PR's --no-traffic deploy pins the traffic to the revision it had; take it back.
            retry gcloud run services update-traffic "${service[@]}" --to-latest
            url="$(gcloud run services describe "${service[@]}" --format='value(status.url)')"
          fi
          echo "url=${url}/reports/" >> "$GITHUB_OUTPUT"
          echo "Demo: ${url}/reports/" >> "$GITHUB_STEP_SUMMARY"

  # Merges the weekly update once everything above passed on its branch.
  automerge:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automated/update-deps'
    needs: [check, container]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge the update PR, then build and publish main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head automated/update-deps --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"${GITHUB_SHA}\") | .number")"
          if [ -z "$pr" ]; then
            echo "No open update PR at ${GITHUB_SHA}; nothing to merge."
            exit 0
          fi
          # The PR also gets a pull_request run that waits for approval, as it was opened by a
          # bot, and fails once the PR closes. This run stands in for it, so delete it.
          gh run list --branch automated/update-deps --event pull_request --commit "$GITHUB_SHA" \
            --json databaseId,conclusion --jq '.[] | select(.conclusion == "action_required") | .databaseId' |
            xargs -r -n1 gh run delete
          gh pr merge "$pr" --squash --delete-branch
          gh workflow run ci.yml --ref main
